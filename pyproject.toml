[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-db-change-analyzer"
version = "0.1.0"
description = "Evidence-bound Oracle DDL change analysis from fixed Git revisions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
authors = [{name = "mehmet-karacan"}]
dependencies = [
  "antlr4-python3-runtime==4.13.2",
  "httpx==0.28.1",
  "Jinja2==3.1.6",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "tzdata==2026.4",
]

[project.scripts]
db-change-analyzer = "db_change_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
db_change_analyzer = [
  "migrations/*.sql",
  "prompts/*.txt",
  "prompts/*.md",
  "templates/*.j2",
  "templates/innova_v1/*.j2",
  "templates/v5/*.j2",
  "templates/v5/components/*.j2",
  "templates/v5/objects/*.j2",
  "assets/*.png",
  "oracle/generated/*.json",
  "taxonomy/*.json",
  "schemas/*.json",
  "schemas/v5/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: requires explicitly authorized external services",
  "scale: exercises real multi-invocation 41/100 object workflows and may be slow",
]
